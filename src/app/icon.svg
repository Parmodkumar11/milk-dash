  <!-- Milk splash left -->
  <path d="M36 38 Q30 28 26 32 Q30 22 38 30 Z" fill="white" stroke="#F5DEB3" stroke-width="1.5"/>
  <!-- Milk splash center -->
  <path d="M50 36 Q50 24 50 30 Q54 20 56 28 Q52 24 50 36 Z" fill="white" stroke="#F5DEB3" stroke-width="1.5"/>
  <!-- Milk splash right -->
  <path d="M64 38 Q70 28 74 32 Q70 22 62 30 Z" fill="white" stroke="#F5DEB3" stroke-width="1.5"/>
